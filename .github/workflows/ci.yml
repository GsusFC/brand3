name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: brand3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Focal tests and strategic benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focal tests
        run: |
          python -m pytest \
            tests/test_tldr_brand3_research_pack_dataset.py \
            tests/test_research_pack_contract.py \
            tests/test_research_evidence_graph.py \
            tests/test_magnetism_analyst_tldr.py \
            tests/test_magnetism_tldr_guardrails.py \
            tests/test_tldr_brand3_research_pack_evaluation.py \
            tests/test_tldr_brand3_strategic_quality.py

      - name: Run strategic benchmark gate
        run: |
          python scripts/evaluate_tldr_brand3_research_pack.py \
            --strategic-quality \
            --strategic-quality-from-benchmark \
            --strategic-quality-gate
