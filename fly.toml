# fly.toml app configuration file generated for brand3 on 2026-05-25T14:19:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'brand3'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  BRAND3_ANALYSIS_TIMEOUT_SECONDS = '600'
  BRAND3_BASE_URL = 'https://brand3.fly.dev'
  BRAND3_ENVIRONMENT = 'production'
  BRAND3_MAX_CONCURRENT_ANALYSES = '1'
  BRAND3_RATE_LIMIT_PER_IP = '5'
  BRAND3_RATE_LIMIT_WINDOW_HOURS = '24'
  BRAND3_REQUEUE_IN_FLIGHT_ON_STARTUP = 'false'

[[mounts]]
  source = 'brand3_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/_health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
